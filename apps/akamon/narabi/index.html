<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>かずの ならび</title>
  <link rel="stylesheet" href="../common/akamon.css?v=1">
  <link rel="stylesheet" href="style.css?v=1">
  <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="wrap">
  <header>
    <div class="head-left">
      <button class="back-btn" onclick="location.href='../'" aria-label="赤門クイズへ もどる">⬅</button>
      <div>
        <h1>かずの ならび</h1>
        <p class="sub">さんすう 1ねんせい　おなじ かずずつ ふえたり へったり</p>
      </div>
    </div>
    <div class="score" aria-live="polite">はなまる <b id="score">0</b> こ</div>
  </header>
  <main class="q">
    <div class="panel">
      <h2>ひだりから みぎに おなじ かずずつ ふえたり へったり するよ。<br>あいている □に はいる かずは どれかな？</h2>
      <div class="stage grow">
        <div class="seq" id="seq"></div>
      </div>
      <div class="say" id="say-quiz" aria-live="polite"></div>
      <div class="choices" id="choices"></div>
      <div class="row" id="q-actions"></div>
    </div>
  </main>
</div>

  <script src="../common/akamon.js?v=1"></script>
  <script src="game.js?v=1"></script>
</body>
</html>
