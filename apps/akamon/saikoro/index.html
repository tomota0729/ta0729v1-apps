<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>さいころの かくれた め</title>
  <link rel="stylesheet" href="../common/akamon.css?v=3">
  <link rel="stylesheet" href="../common/quiz.css?v=7">
  <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="wrap">
  <header>
    <div class="head-left">
      <button class="back-btn" onclick="location.href='../'" aria-label="赤門クイズへ もどる">⬅</button>
      <div>
        <h1>🎲 さいころの かくれた め</h1>
        <p class="sub">さんすう　むかいあう めんを たすと 7</p>
      </div>
    </div>
    <div class="score" aria-live="polite">はなまる <b id="score">0</b> こ</div>
  </header>
  <main class="q">
    <div class="panel">
      <div id="qview">
        <div class="prog" id="prog"></div>
        <p class="stem" id="stem"></p>
        <div class="fig grow" id="fig"></div>
        <div class="choices" id="choices"></div>
      </div>
      <div id="other" hidden></div>
      <div class="say" id="say-quiz" aria-live="polite"></div>
      <div class="row" id="q-actions"></div>
    </div>
  </main>
</div>
  <script src="../common/akamon.js?v=3"></script>
  <script src="../common/cube.js?v=11"></script>
  <script src="../common/miniquiz.js?v=5"></script>
  <script src="game.js?v=11x"></script>
</body>
</html>
