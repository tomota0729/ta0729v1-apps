<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>たんげん れんしゅう</title>
  <link rel="stylesheet" href="../common/akamon.css?v=1">
  <link rel="stylesheet" href="../common/quiz.css?v=1">
  <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="wrap">
  <header>
    <div class="head-left">
      <button class="back-btn" onclick="location.href='../'" aria-label="赤門クイズへ もどる">⬅</button>
      <div>
        <h1>✏️ たんげん れんしゅう</h1>
        <p class="sub">さんすう 1ねんせい　にがてな ところを 10もんずつ れんしゅう</p>
      </div>
    </div>
  </header>
  <main class="page-scroll">
    <div class="cards" id="cards"></div>
  </main>
</div>
  <script src="../common/akamon.js?v=1"></script>
  <script src="../common/figs.js?v=1"></script>
  <script src="../common/gens.js?v=1"></script>
  <script>
    Object.entries(UNITS).forEach(([k, u]) => {
      const a = document.createElement('a');
      a.className = 'card'; a.href = 'play.html?t=' + k; a.style.borderColor = u.color;
      a.innerHTML = `<span class="e">${u.emoji}</span><span class="n">${u.name}</span><span class="d">${u.items.length}しゅるい</span>`;
      $('cards').appendChild(a);
    });
  </script>
</body>
</html>
