<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>たんげん れんしゅう</title>
  <link rel="stylesheet" href="../common/akamon.css?v=1">
  <link rel="stylesheet" href="../common/quiz.css?v=1">
  <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="wrap">
  <header>
    <div class="head-left">
      <button class="back-btn" onclick="location.href='./'" aria-label="たんげんを えらぶ">⬅</button>
      <div>
        <h1 id="title">たんげん れんしゅう</h1>
        <p class="sub">さんすう 1ねんせい　ぜんこく とういつ テストと おなじ しゅるいの もんだい</p>
      </div>
    </div>
    <div class="score" aria-live="polite">はなまる <b id="score">0</b> こ</div>
  </header>
  <main class="q">
    <div class="panel">
      <div id="qview">
        <div class="prog" id="prog"></div>
        <p class="intro" id="intro"></p>
        <p class="stem" id="stem"></p>
        <div class="fig grow" id="fig"></div>
        <div class="choices" id="choices"></div>
      </div>
      <div id="other" hidden></div>
      <div class="say" id="say-quiz" aria-live="polite"></div>
      <div class="row" id="q-actions"></div>
    </div>
  </main>
</div>
  <script src="../common/akamon.js?v=1"></script>
  <script src="../common/figs.js?v=1"></script>
  <script src="../common/gens.js?v=1"></script>
  <script src="../common/runner.js?v=1"></script>
  <script>
    const key = new URLSearchParams(location.search).get('t');
    if (!UNITS[key]) location.href = './';
    else {
      document.title = UNITS[key].name;
      $('title').textContent = `${UNITS[key].emoji} ${UNITS[key].name}`;
      RUN.practice(key);
    }
  </script>
</body>
</html>
