<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ねんべつ テスト</title>
  <link rel="stylesheet" href="../common/akamon.css?v=1">
  <link rel="stylesheet" href="../common/quiz.css?v=1">
  <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="wrap">
  <header>
    <div class="head-left">
      <button class="back-btn" onclick="location.href='../'" aria-label="赤門クイズへ もどる">⬅</button>
      <div>
        <h1>📅 ねんべつ テスト</h1>
        <p class="sub">さんすう 1ねんせい　ぜんこく とういつ テストと おなじ しゅるいの もんだいを、ちがう かずで</p>
      </div>
    </div>
  </header>
  <main class="page-scroll">
    <div class="cards" id="cards"></div>
  </main>
</div>
  <script src="../common/akamon.js?v=1"></script>
  <script src="../common/figs.js?v=1"></script>
  <script src="../common/gens.js?v=1"></script>
  <script src="../common/years.js?v=1"></script>
  <script src="../common/runner.js?v=1"></script>
  <script>
    YEARS.forEach(y => {
      const n = y.dai.reduce((s, d) => s + d.items.length, 0);
      const best = RUN.getBest(y.id);
      const a = document.createElement('a');
      a.className = 'card'; a.href = 'test.html?y=' + y.id;
      a.style.borderColor = y.id.endsWith('11') ? '#E0513B' : '#2F6FDB';
      a.innerHTML = `<span class="e">${y.id.endsWith('11') ? '🍁' : '🌱'}</span><span class="n">${y.label}</span>
        <span class="d">${n}もん${best ? `　いちばん ${best.ok}/${best.total}` : ''}</span>`;
      $('cards').appendChild(a);
    });
  </script>
</body>
</html>
