<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ランダム テスト</title>
  <link rel="stylesheet" href="../common/akamon.css?v=1">
  <link rel="stylesheet" href="../common/quiz.css?v=3">
  <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="wrap">
  <header>
    <div class="head-left">
      <button class="back-btn" onclick="location.href='../'" aria-label="赤門クイズへ もどる">⬅</button>
      <div>
        <h1>🎲 ランダム テスト</h1>
        <p class="sub">さんすう 1ねんせい　いろいろな もんだいが まぜこぜで でるよ</p>
      </div>
    </div>
    <div class="score" aria-live="polite">はなまる <b id="score">0</b> こ</div>
  </header>
  <main class="q">
    <div class="panel">
      <div id="qview" hidden>
        <div class="prog" id="prog"></div>
        <p class="intro" id="intro"></p>
        <p class="stem" id="stem"></p>
        <div class="fig grow" id="fig"></div>
        <div class="choices" id="choices"></div>
      </div>
      <div id="other">
        <div class="cover">
          <div class="big">なんもん ちょうせん する？</div>
          <div class="note">ぜんこく とういつ テスト 17かいぶんと おなじ しゅるいの もんだいから、ランダムに でるよ。<br>さいごまで といてから、まとめて こたえあわせ。</div>
          <div class="pick-n" id="pick"></div>
        </div>
      </div>
      <div class="say" id="say-quiz" aria-live="polite"></div>
      <div class="row" id="q-actions"></div>
    </div>
  </main>
</div>
  <script src="../common/akamon.js?v=1"></script>
  <script src="../common/figs.js?v=3"></script>
  <script src="../common/gens.js?v=3"></script>
  <script src="../common/years.js?v=3"></script>
  <script src="../common/runner.js?v=3"></script>
  <script>
    [[5, 'さくっと', '🐣'], [10, 'ふつう', '🐥'], [20, 'ほんばん なみ', '🦅']].forEach(([n, t, e]) => {
      const b = document.createElement('button');
      const best = RUN.getBest(`random-${n}`);
      b.innerHTML = `${e} ${n}もん<small>${t}${best ? `・いちばん ${best.ok}/${best.total}` : ''}</small>`;
      b.onclick = () => RUN.test(() => randomYear(n), {back: './', backLabel: 'もんだいの かずを えらぶ'});
      $('pick').appendChild(b);
    });
  </script>
</body>
</html>
