<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>赤門クイズ</title>
  <link rel="stylesheet" href="../../style.css">
  <style>
    .top-bar { width: 100%; max-width: 900px; }
    .back-btn {
      background: rgba(255,255,255,0.75);
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 50%;
      width: 44px; height: 44px;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .back-btn:active { transform: scale(0.9); }
    .subject {
      width: 100%; max-width: 900px;
      font-size: 1.3rem; color: #555;
      margin: 8px 0 12px;
      border-bottom: 3px solid rgba(0,0,0,0.08);
      padding-bottom: 4px;
    }
    .app-grid + .subject { margin-top: 32px; }
    .empty { color: #999; font-size: 0.95rem; width: 100%; max-width: 900px; }
  </style>
</head>
<body>
  <div class="top-bar">
    <button class="back-btn" onclick="location.href='../../'" aria-label="ホームへ もどる">🏠</button>
  </div>

  <header>
    <h1>⛩ 赤門クイズ</h1>
    <p class="subtitle">あそびながら もんだいを といてみよう</p>
  </header>

  <h2 class="subject">🎲 さいころ・てんかいず</h2>
  <main class="app-grid" id="grid-saikoro"></main>
  <h2 class="subject">🔢 さんすう</h2>
  <main class="app-grid" id="grid-sansu"></main>
  <h2 class="subject">📖 こくご</h2>
  <main class="app-grid" id="grid-kokugo"></main>

  <script>
    // 赤門クイズの なかの もんだい（ふえたら ここに ついか）
    // subject: 'saikoro'（さいころ・てんかいず） / 'sansu'（さんすう） / 'kokugo'（こくご）
    const QUIZZES = [
      {
        subject: 'saikoro',
        name: 'てんかいず 3たく',
        emoji: '📦',
        url: 'tenkai/',
        color: '#E26A9A',
        description: 'はこに なる てんかいずは どれ？'
      },
      {
        subject: 'saikoro',
        name: 'さいころの かくれた め',
        emoji: '🎲',
        url: 'saikoro/',
        color: '#2F6FDB',
        description: 'むかいあう めんを たすと 7'
      },
      {
        subject: 'saikoro',
        name: 'てんかいずの あいた ます',
        emoji: '🔲',
        url: 'akimasu/',
        color: '#15935A',
        description: '？に はいる 数を こたえよう'
      },
      {
        subject: 'sansu',
        name: 'ボタンで動かそう',
        emoji: '🚗',
        url: 'botan/',
        color: '#2F6FDB',
        description: 'きまりどおりにくるまをうごかそう'
      },
      {
        subject: 'sansu',
        name: 'かずの ならび',
        emoji: '🔢',
        url: 'narabi/',
        color: '#DB9A06',
        description: 'おなじかずずつふえたりへったり'
      },
      {
        subject: 'kokugo',
        name: 'ふきだしの ことば',
        emoji: '💬',
        url: 'fukidashi/',
        color: '#15935A',
        description: 'ばめんにあうことばをえらぼう'
      }
    ];

    ['saikoro', 'sansu', 'kokugo'].forEach(sub => {
      const grid = document.getElementById('grid-' + sub);
      const list = QUIZZES.filter(q => q.subject === sub);
      if (!list.length) {
        grid.outerHTML = '<p class="empty">もうすぐ ふえるよ</p>';
        return;
      }
      list.forEach(q => addCard(grid, q));
    });

    function addCard(grid, q) {
      const card = document.createElement('a');
      card.href = q.url;
      card.className = 'app-card';
      card.style.borderColor = q.color;
      card.style.background = `linear-gradient(145deg, white, ${q.color}22)`;
      card.innerHTML = `
        <span class="emoji">${q.emoji}</span>
        <span class="name">${q.name}</span>
        <span class="desc">${q.description}</span>
      `;
      grid.appendChild(card);
    }
  </script>
</body>
</html>
