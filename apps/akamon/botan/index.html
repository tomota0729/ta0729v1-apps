<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ボタンで動かそう</title>
  <link rel="stylesheet" href="../common/akamon.css?v=3">
  <link rel="stylesheet" href="style.css?v=8">
  <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="wrap">
  <header>
    <div class="head-left">
      <button class="back-btn" onclick="location.href='../'" aria-label="赤門クイズへ もどる">⬅</button>
      <div>
        <h1>ボタンで動かそう<span class="syms" aria-hidden="true"><span style="color:var(--b-up)">▲</span><span style="color:var(--b-down)">●</span><span style="color:var(--b-left)">◆</span><span style="color:var(--b-right)">★</span></span></h1>
        <p class="sub">さんすう 1ねんせい　ボタンを 7かい おして 🚗を 🏠へ とめよう</p>
      </div>
    </div>
    <div class="score" aria-live="polite">はなまる <b id="score">0</b> こ</div>
  </header>
  <main class="q">
    <div class="panel">
      <h2 id="q-title"></h2>
      <svg class="board grow" id="b-quiz" aria-label="ますめ"></svg>
      <div class="chips" id="q-chips"></div>
      <div class="say" id="say-quiz" aria-live="polite"></div>
      <div class="pad" id="pad-quiz"></div>
      <div class="row" id="q-actions"></div>
    </div>
  </main>
</div>

  <script src="../common/akamon.js?v=3"></script>
  <script src="game.js?v=6"></script>
</body>
</html>
