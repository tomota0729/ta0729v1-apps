<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ボタンで動かそう</title>
  <link rel="stylesheet" href="style.css?v=7">
  <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="wrap">
  <header>
    <div class="head-left">
    <button class="back-btn" onclick="location.href='../'" aria-label="赤門クイズへ もどる">⬅</button>
    <div>
      <h1>ボタンで動かそう<span class="syms" aria-hidden="true"><span style="color:var(--b-up)">▲</span><span style="color:var(--b-down)">●</span><span style="color:var(--b-left)">◆</span><span style="color:var(--b-right)">★</span></span></h1>
      <p class="sub">さんすう 1ねんせい　ボタンを 7かい おして 🚗を 🏠へ とめよう</p>
    </div>
    </div>
    <div class="score" aria-live="polite">はなまる <b id="score">0</b> こ</div>
  </header>
  <section id="p-quiz" class="solo">
    <div class="panel board-box">
      <h2 id="q-title"></h2>
      <svg class="board" id="b-quiz" aria-label="ますめ"></svg>
      <div class="chips" id="q-chips"></div>
      <div class="say" id="say-quiz" aria-live="polite"></div>
      <div class="pad" id="pad-quiz"></div>
      <div class="row" id="q-actions"></div>
    </div>
  </section>
</div>
<div id="hana" hidden>
  <svg viewBox="0 0 300 300" aria-hidden="true">
    <path class="ring" d="M150 40 C 230 40 265 110 250 170 C 235 240 150 270 90 240 C 30 205 35 110 90 70 C 140 35 215 70 220 140 C 225 200 165 225 125 200 C 90 178 100 125 140 118"/>
    <text x="150" y="290">よくできました</text>
  </svg>
</div>

  <script src="game.js?v=5"></script>
</body>
</html>
