<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>けいさんフラッシュ</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-header" id="appHeader">
    <button class="icon-btn" id="btnHome" title="ホーム">🏠</button>
    <span class="app-title">⚡ けいさんフラッシュ</span>
  </div>

  <!-- ① トップ（操作・レベル・数の選択） -->
  <section class="screen active" id="screen-top">
    <p class="lead">こえで こたえよう！</p>
    <p class="sub">3びょうで こたえを タッチ！</p>

    <div class="pick-group">
      <div class="pick-label">けいさん</div>
      <div class="op-row" id="opRow"></div>
    </div>

    <div class="pick-group">
      <div class="pick-label">レベル</div>
      <div class="level-list" id="levelList"></div>
    </div>

    <div class="pick-group">
      <div class="pick-label">もんだいの かず</div>
      <div class="count-seg" id="countSeg"></div>
    </div>

    <button class="btn-start" id="btnStart" disabled>▶ スタート</button>
  </section>

  <!-- ② フラッシュ（メイン） -->
  <section class="screen" id="screen-flash">
    <div class="flash-top">
      <span class="progress" id="progress">もんだい 1 / 10</span>
      <span class="redo-badge" id="redoBadge">🔁 まちがいなおし</span>
    </div>

    <div class="problem-wrap">
      <div class="problem" id="problem">6 ＋ 9</div>
    </div>

    <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>

    <div class="choices" id="choices"></div>
  </section>

  <!-- ③ まちがい一覧 → まちがい直し -->
  <section class="screen" id="screen-redo">
    <div class="redo-title">まちがえた もんだい</div>
    <div class="redo-count" id="redoCount">3もん</div>
    <div class="wrong-list" id="wrongList"></div>
    <button class="btn-start" id="btnBeginRedo">この もんだいを もういちど ▶</button>
  </section>

  <!-- ④ おしまい -->
  <section class="screen" id="screen-done">
    <div class="done-emoji">🎉</div>
    <div class="done-title">ぜんぶ ◯に なったね！</div>
    <div class="done-stats" id="doneStats"></div>
    <div class="tendency" id="tendency"></div>
    <div class="done-btns">
      <button class="btn-start" id="btnRestart">🔄 もういちど</button>
      <button class="btn-sub" id="btnChangeLevel">メニューへ</button>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
